<text x="48" y="800" font-family='"Segoe UI",Arial,sans-serif' font-size="10.5" fill="#6f635a" text-anchor="start" font-weight="normal">Sessions are server-side; the</text>
<text x="48" y="814" font-family='"Segoe UI",Arial,sans-serif' font-size="10.5" fill="#6f635a" text-anchor="start" font-weight="normal">browser holds no Firebase credential.</text>
<rect x="444" y="150" width="692" height="118" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="458" y="172" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">HTTP layer</text><text x="458" y="192" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">routes/web.php — customer · cashier · admin · kitchen areas</text><text x="458" y="210" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Middleware: auth · staff.role · kitchen secret · historical sales</text><text x="458" y="228" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">canonical host · throttle · per-area auth guards</text><text x="458" y="246" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Form requests validate and authorise every write</text>
<rect x="444" y="284" width="692" height="64" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="458" y="306" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Controllers</text><text x="458" y="326" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Customer · Cashier · Admin · Kitchen · Auth</text>
<rect x="444" y="364" width="692" height="100" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="458" y="386" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Domain actions &amp; services</text><text x="458" y="406" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Orders — place · settle · verify · reject · void · close · restore</text><text x="458" y="424" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Rentals · Reservations · Catalog/Promos · Settings · Staff</text><text x="458" y="442" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Proofs (upload, submit, cleanup) · Activity feed · Audit log</text>
<rect x="444" y="480" width="692" height="100" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="458" y="502" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Read models (Stats) &amp; caches</text><text x="458" y="522" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">SalesLedger · PaymentMix · DailyTender · DailySales · TenderCounts</text><text x="458" y="540" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">DashboardMetrics · ProductTally · BookingMix · ServiceMix</text><text x="458" y="558" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Caches: catalog · cashier queue · kitchen board · availability</text>
<rect x="444" y="596" width="692" height="82" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="458" y="618" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Console &amp; scheduler</text><text x="458" y="638" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">orders:expire · orders:close — every minute; rentals:lapse — every minute</text><text x="458" y="656" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">proofs:cleanup — 23:59 daily · export:run — incremental backup</text>
<rect x="444" y="694" width="692" height="100" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="458" y="716" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">RtdbClient  (single data-access seam)</text><text x="458" y="736" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">RestRtdbClient — HTTPS REST to RTDB with a service-account JWT</text><text x="458" y="754" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Bounded queries: orderBy(indexed field) + startAt/endAt/range only</text><text x="458" y="772" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">InMemoryRtdbClient — in-memory double for the Pest suite</text>
<text x="444" y="826" font-family='"Segoe UI",Arial,sans-serif' font-size="10.5" fill="#6f635a" text-anchor="start" font-weight="normal">Write path  request → middleware → controller → domain action → RtdbClient</text>
<text x="444" y="842" font-family='"Segoe UI",Arial,sans-serif' font-size="10.5" fill="#6f635a" text-anchor="start" font-weight="normal">Read path  controller → Stats read model → RtdbClient (indexed range)</text>
<rect x="1236" y="150" width="356" height="82" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="1250" y="172" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Google OAuth 2.0</text><text x="1250" y="192" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Laravel Socialite · &quot;Sign in with Google&quot;</text><text x="1250" y="210" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Per-area sessions: admin · cashier · customer</text>
<rect x="1236" y="250" width="356" height="172" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="1250" y="272" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Firebase Realtime Database</text><text x="1250" y="292" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">orders · sales · proofs · audit · idem</text><text x="1250" y="310" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">products · categories · rentals · rentalBookings</text><text x="1250" y="328" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">reservations · users · staff · settings</text><text x="1250" y="346" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">stats/top3 · export/state</text><text x="1250" y="364" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">— single source of truth —</text><text x="1250" y="382" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">*.firebaseio.com over HTTPS REST</text><text x="1250" y="400" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">service account, server-side only</text>
<rect x="1236" y="440" width="356" height="100" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="1250" y="462" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Security rules</text><text x="1250" y="482" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">.read / .write require auth != null</text><text x="1250" y="500" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">.indexOn: soldAt · placedAt · dateFrom</text><text x="1250" y="518" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">status · terminalAt · updatedAt …</text>
<rect x="1236" y="558" width="356" height="82" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="1250" y="580" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Runtime</text><text x="1250" y="600" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">PHP 8.2 · Docker or XAMPP (artisan serve)</text><text x="1250" y="618" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">file cache · server-side sessions</text>
<rect x="1236" y="658" width="356" height="100" rx="10" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.2"/><text x="1250" y="680" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Backups</text><text x="1250" y="700" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">export:run → exports/*.json (incremental)</text><text x="1250" y="718" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">durable trees only — proofs excluded</text><text x="1250" y="736" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">watermark: export/state.lastRun</text>
