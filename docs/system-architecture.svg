<rect x="48" y="282" width="248" height="100" rx="10" fill="#f6efe3" stroke="#e8dcc4" stroke-width="1.2"/><text x="62" y="304" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Cashier register</text><text x="62" y="324" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Walk-in register · split tender</text><text x="62" y="342" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Online queue: verify / reject</text><text x="62" y="360" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Reservations · rental counter</text>
