<rect x="48" y="546" width="248" height="82" rx="10" fill="#f6efe3" stroke="#e8dcc4" stroke-width="1.2"/><text x="62" y="568" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#2a221d" text-anchor="start" font-weight="600">Kitchen board</text><text x="62" y="588" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Secret-gated ticket board</text><text x="62" y="606" font-family='"Segoe UI",Arial,sans-serif' font-size="11.5" fill="#6f635a" text-anchor="start" font-weight="normal">Tickets by pickup time</text>
