<text x="316" y="956" font-family='"Segoe UI",Arial,sans-serif' font-size="11" fill="#6f635a" text-anchor="start" font-weight="normal">federated identity</text>
<text x="470" y="956" font-family='"Segoe UI",Arial,sans-serif' font-size="11" fill="#6f635a" text-anchor="start" font-weight="normal">Every read is bounded by an indexed field; every write is validated server-side. The browser never talks to Firebase directly.</text>
