<text x="40" y="52" font-family='"Segoe UI",Arial,sans-serif' font-size="26" fill="#2a221d" text-anchor="start" font-weight="700">Crates N' Plates — System Architecture</text>
<text x="40" y="78" font-family='"Segoe UI",Arial,sans-serif' font-size="13" fill="#6f635a" text-anchor="start" font-weight="normal">Laravel 12 monolith over Firebase Realtime Database · server-rendered pages · Google sign-in · no client-side SPA</text>
